name: Maven Central release
description: Track a tag-driven Maven Central release from master.
title: "[Release]: "
labels:
  - release
body:
  - type: input
    id: version
    attributes:
      label: Release version
      description: Plain semantic version and matching tag, for example 2.0.2 / v2.0.2.
      placeholder: 2.0.2 / v2.0.2
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Accepted master commit and pull requests included in this release.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Required checks
      description: List master CI evidence, tag containment, Central publication, and GitHub Release checks.
    validations:
      required: true
