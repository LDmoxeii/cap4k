name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cap4k_test
          POSTGRES_USER: cap4k
          POSTGRES_PASSWORD: cap4k
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cap4k -d cap4k_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CAP4K_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/cap4k_test
      CAP4K_TEST_POSTGRES_USER: cap4k
      CAP4K_TEST_POSTGRES_PASSWORD: cap4k

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Classify change
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $encoding = [System.Text.UTF8Encoding]::new($false)

          if ($env:EVENT_NAME -eq 'pull_request') {
            if ($env:BASE_REF -cne 'master') {
              throw "Pull requests must target master; got $($env:BASE_REF)."
            }

            & git fetch --no-tags --prune origin "+refs/heads/$($env:BASE_REF):refs/remotes/origin/$($env:BASE_REF)"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch the pull request base branch.' }

            $changedFilesFile = Join-Path $env:RUNNER_TEMP 'cap4k-changed-files.txt'
            $diffLines = @(& git diff --name-status --find-renames "origin/$($env:BASE_REF)...HEAD")
            if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect changed paths.' }
            [System.IO.File]::WriteAllLines($changedFilesFile, $diffLines, $encoding)

            $classificationJson = (& ./scripts/classify-ci-change.ps1 -ChangedFilesFile $changedFilesFile -GitHubOutputFile $env:GITHUB_OUTPUT | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Failed to classify changed paths.' }
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "changed_files_file=$changedFilesFile`n", $encoding)
            Write-Output $classificationJson
          } else {
            $outputs = @(
              'run_gradle=true'
              'docs_only=false'
              'governance_skill_only=false'
              'gradle_skippable=false'
              'changed_file_count=0'
              'changed_files_file='
            )
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, (($outputs -join "`n") + "`n"), $encoding)
            Write-Output '{"run_gradle":true,"docs_only":false,"governance_skill_only":false,"gradle_skippable":false,"changed_file_count":0}'
          }

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Export capability contract facts
        shell: pwsh
        run: ./scripts/export-capability-contract-facts.ps1 -OutputFile build/cap4k/capability-contract-facts.json

      - name: Validate capability contract
        shell: pwsh
        run: ./scripts/validate-capability-contract.ps1 -FactsFile build/cap4k/capability-contract-facts.json

      - name: Validate cap4k skill
        shell: pwsh
        run: ./skills/scripts/validate-cap4k-skills.ps1 -FactsFile build/cap4k/capability-contract-facts.json

      - name: Validate current runtime facts
        shell: pwsh
        run: ./scripts/validate-current-runtime-facts.ps1 -FactsFile build/cap4k/capability-contract-facts.json

      - name: Test capability contract validator
        shell: pwsh
        run: ./scripts/test-capability-contract.ps1 -FactsFile build/cap4k/capability-contract-facts.json

      - name: Test PR workflow guard
        shell: pwsh
        run: ./scripts/test-pr-workflow.ps1

      - name: Validate PR body
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $bodyFile = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          Set-Content -LiteralPath $bodyFile -Value $env:PR_BODY -Encoding utf8NoBOM
          ./scripts/validate-pr-body.ps1 -BodyFile $bodyFile -Base $env:BASE_REF -RequireChangeType -FactsFile build/cap4k/capability-contract-facts.json -ChangedFilesFile '${{ steps.classify.outputs.changed_files_file }}'

      - name: Test buildSrc
        if: steps.classify.outputs.run_gradle == 'true'
        working-directory: buildSrc
        run: ../gradlew test

      - name: Check
        if: steps.classify.outputs.run_gradle == 'true'
        run: ./gradlew check

      - name: Skip Gradle
        if: steps.classify.outputs.run_gradle != 'true'
        run: echo "Documentation/governance/Skill-only change detected; full Gradle check skipped."
