acceptance:
  - id: A1
    source: specs/design-json-field-kdoc/spec.md
    text: request field description - **GIVEN** a supported design entry contains a
      field object with `name`, `type`, and a non-blank `description` - **WHEN**
      cap4k parses the Design JSON and generates the corresponding Kotlin design
      type - **THEN** the canonical field retains the description - **AND** the
      generated Kotlin field is preceded by a KDoc block containing the
      sanitized description - **AND** the field name, rendered type,
      nullability, default value, order, and imports remain unchanged.
    result: passed
    reason:
      text: DesignJsonSourceProvider 读取并规范化请求字段 description，语义模型和默认模板保留字段语义并输出 KDoc。
      truncated: false
  - id: A2
    source: specs/design-json-field-kdoc/spec.md
    text: result field description - **GIVEN** a supported design entry contains
      `resultFields` with a non-blank field `description` - **WHEN** cap4k
      generates the corresponding result fields - **THEN** each described result
      field receives the same KDoc projection rules as request fields.
    result: passed
    reason:
      text: resultFields 走同一解析、语义、渲染和模板 KDoc 投影路径，已有源代码测试覆盖。
      truncated: false
  - id: A3
    source: specs/design-json-field-kdoc/spec.md
    text: nested field description - **GIVEN** a design field resolves to a nested
      canonical value definition whose fields contain descriptions - **WHEN**
      the generator renders nested Kotlin value types - **THEN** described
      nested fields receive KDoc using the same sanitizer and omission rules.
    result: passed
    reason:
      text: 嵌套 canonical value fields 的 description 通过 SemanticValueCompiler/PathNode
        传递，嵌套模板输出 KDoc。
      truncated: false
  - id: A4
    source: specs/design-json-field-kdoc/spec.md
    text: absent or blank description - **GIVEN** a field has no `description`, an
      empty description, or whitespace-only description - **WHEN** the field is
      rendered - **THEN** no empty KDoc block is generated - **AND** the
      existing field output remains unchanged.
    result: passed
    reason:
      text: 缺失、空字符串和空白 description 归一为 null/空渲染文本，不生成空 KDoc，旧字段格式保持不变。
      truncated: false
  - id: A5
    source: specs/design-json-field-kdoc/spec.md
    text: unsafe KDoc text - **GIVEN** a field description contains `*/` - **WHEN**
      cap4k renders the field KDoc - **THEN** the generated source remains
      syntactically valid - **AND** the closing sequence is sanitized
      consistently with existing description handling.
    result: passed
    reason:
      text: KDoc sanitizer 将 */ 转为 * /，并有多行文本和生成编译验证，避免提前闭合注释。
      truncated: false
  - id: A6
    source: specs/design-json-field-kdoc/spec.md
    text: backward-compatible parsing - **GIVEN** existing Design JSON without field
      descriptions - **WHEN** it is parsed and generated - **THEN** parsing
      succeeds and existing generated semantics remain unchanged.
    result: passed
    reason:
      text: description 为可选尾部字段，旧 Design JSON 仍可解析；既有无描述 fixture 通过完整测试。
      truncated: false
  - id: A7
    source: specs/design-json-field-kdoc/spec.md
    text: analyzer boundary - **GIVEN** generated Kotlin contains field KDoc from
      Design JSON descriptions - **WHEN** the code-analysis pipeline processes
      the generated source - **THEN** Analyzer continues to use design metadata
      annotations as its description input - **AND** it does not need to parse
      KDoc or ordinary comments.
    result: passed
    reason:
      text: Analyzer 继续以 design metadata annotation 为描述输入，未引入 KDoc/普通注释解析；边界行为与实现一致。
      truncated: false
  - id: A8
    source: specs/design-json-field-kdoc/spec.md
    text: "A1: parser/model preservation is covered by focused source-provider/model
      tests."
    result: passed
    reason:
      text: source provider 与 SemanticValueCompiler focused tests 覆盖 parser/model
        preservation。
      truncated: false
  - id: A9
    source: specs/design-json-field-kdoc/spec.md
    text: "A2: render model and sanitizer behavior is covered by focused generator
      tests, including missing, blank, multiline, and `*/` descriptions."
    result: passed
    reason:
      text: render model/sanitizer tests 覆盖 missing、blank、multiline 和 */。
      truncated: false
  - id: A10
    source: specs/design-json-field-kdoc/spec.md
    text: "A3: every default design template that emits request/result/nested fields
      projects field KDoc without changing existing field code."
    result: passed
    reason:
      text: capability、command、domain_event、endpoint、integration_event、query
        六个默认模板均加入条件 KDoc 投影，嵌套字段也覆盖。
      truncated: false
  - id: A11
    source: specs/design-json-field-kdoc/spec.md
    text: "A4: cap4k full relevant test suites and a clean build pass."
    result: passed
    reason:
      text: Runtime clean build 通过（340 actionable tasks），相关模块完整测试套件及 git diff --check
        均通过。
      truncated: false
  - id: A12
    source: specs/design-json-field-kdoc/spec.md
    text: "A5: an integration fixture with `design.json` field descriptions
      generates compilable Kotlin containing the expected KDoc."
    result: passed
    reason:
      text: design-compile-sample 含请求、结果和嵌套
        description，PipelinePluginCompileFunctionalTest 断言生成 KDoc 并完成
        compileKotlin。
      truncated: false
  - id: A13
    source: specs/design-json-field-kdoc/spec.md
    text: "A6: Analyzer boundary and backward compatibility are explicitly tested or
