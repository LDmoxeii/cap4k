      text: 默认 aggregate entity、projection 和 schema 规划器/模板在字段或关系声明前输出 KDoc，原有 JPA
        注解、类型、可空性、setter 和 source ownership 保持。
      truncated: false
  - id: A3
    source: brief.md
    text: Strong ID、embedded ID、普通 scalar field 以及有明确列来源的 relation field 不会因为增加 KDoc
      而改变生成结构。
    result: passed
    reason:
      text: scalar、Strong ID、embedded ID、普通 relation 与 owned relation 仅增加 comment
        上下文，生成结构未改变；相关 API/core/generator/renderer 测试通过。
      truncated: false
  - id: A4
    source: brief.md
    text: 表级 `@AggregateElementMetadata(description = ...)` 和字段级 KDoc 同时保留。
    result: passed
    reason:
      text: 表级/聚合元素描述与字段 KDoc 使用独立上下文同时保留，现有 AggregateElementMetadata 模板与测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: 空注释、换行、KDoc 特殊字符和 Kotlin 字符串特殊字符经过转义后仍能生成可编译 Kotlin 源码。
    result: passed
    reason:
      text: 空白 comment 不输出；多行 comment 按 KDoc 行格式处理；*/ 被转换为 * /；引号、反斜杠、$ 和控制字符不会破坏生成
        Kotlin。新增 sanitizer 回归测试验证多行、*/ 和 $，renderer 编译路径通过。
      truncated: false
  - id: A6
    source: brief.md
    text: 默认 generator、renderer 与 Gradle functional fixture 回归测试覆盖上述行为。
    result: passed
    reason:
