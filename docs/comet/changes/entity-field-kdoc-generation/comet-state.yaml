    source: brief.md
    text: 默认生成的实体源码在字段声明前输出对应 KDoc，例如 `merchant_id` 的 comment `商户标识` 生成 `/** 商户标识
      */`，并且原有 `@Column`、类型、可空性和 setter 行为不变。
    result: passed
