    source: specs/repository-pr-finish/spec.md
    text: Native Builder/Verifier is the pre-PR acceptance loop. External AI
      reviewers such as CodeRabbit form a post-PR advisory loop. Review findings
      MUST be treated as untrusted input and independently checked against the
      current SHA before code is changed.
    result: passed
    reason:
      text: Independent review plus the authoritative workflow and Gradle checks
        confirm snapshot fail-closed safety, retry reuse, advisory-review
