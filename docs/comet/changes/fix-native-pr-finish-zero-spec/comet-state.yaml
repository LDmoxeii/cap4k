  - id: A63
    source: specs/repository-pr-finish/spec.md
    text: Before any remote mutation, the flow MUST fail if the authoring artifact
      or deterministic validation is invalid, including a missing, invalid,
      non-tree, or tampered snapshot or any post-snapshot non-Archive path
      change. Tests MUST cover the isolated-index snapshot without altering the
      real index, stable source hashing under a real `core.autocrlf=true`
      checkout, permitted Runtime Archive progression, and each fail-closed
      snapshot case. After a PR has been observed, any provider failure MUST
      preserve enough verified identity for safe retry without treating
      unverified provider claims as trusted output. A failed finish MUST
      preserve the PR and worktree and expose the Native recovery command.
      Retrying with the same accepted commit, tree snapshot, and authored
      content MUST reuse the unique PR rather than create a duplicate.
    result: passed
    reason:
      text: Independent review plus the authoritative workflow and Gradle checks
        confirm snapshot fail-closed safety, retry reuse, advisory-review
        boundaries, and the required check gate remain intact.
      truncated: false
