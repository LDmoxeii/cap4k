      provider，且原有 Native snapshot 配置保持不变。"
    result: passed
    reason:
      text: Repository config points to the project-relative repository-command
        provider and preserves the existing Native snapshot settings.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: adapter 只接受 `comet.native.pull-request-finish-input.v1`，拒绝错误 schema、非
      `master` base、非法 head、无效 Git OID 和越界输入；stdout 成功时只包含一个 result JSON。"
    result: passed
    reason:
      text: Adapter enforces exact v1 input/schema, master/base/head/OID/bounds rules,
        with one JSON stdout object on success and stderr diagnostics on
        failure.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 用户选择 `finish=pull-request` 后，Native Agent 自动生成符合 tracked template 的
      repository-owned authoring artifact，不展示 title/body 二次确认；artifact 同时绑定
      change、base、head、已验收的 pre-Archive commit identity、当前已验收 working tree 的完整
      Git tree snapshot identity（`source.preArchiveTreeSha`）、来源
      state/verification identity、换行规范化后的 brief/Spec/template 内容散列与内容指纹。"
    result: passed
    reason:
      text: Artifact binds accepted change/state/verification/head/tree plus canonical
        brief, Spec, template hashes and deterministic fingerprint.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: authoring artifact 中的语义内容覆盖 Summary、Issue/Acceptance、六个 capability
      surfaces、shared contracts、propagation closure、composition/sibling
      responsibility、audit focus、实际 verification、Agent Review 和 release note；本地
      validator 使用当前 diff 与 capability facts 验证承重字段后才允许远端 mutation。"
    result: passed
    reason:
      text: Tracked template, current diff, capability facts, and deterministic body
        validation preserve the required reviewer context before remote
        mutation.
      truncated: false
  - id: A5
