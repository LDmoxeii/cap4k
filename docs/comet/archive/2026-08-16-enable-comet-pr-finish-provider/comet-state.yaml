    text: "A5: 没有现有 PR 时，provider 通过 `scripts/create-pr.ps1` 创建唯一 PR，并仅在远端 body
      重新通过仓库 validator 后返回 `created` 与 `remoteVerified: true`。"
    result: passed
    reason:
      text: The zero-open-PR path creates exactly one PR through create-pr.ps1 and
        returns created only after remote body and identity revalidation.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 已有唯一 open PR 时，provider 不重复创建；它只在远端 title/body 与 authoring artifact
      一致且 identity 合规时复用并重新核验该 PR，返回 `reused`。任何漂移都 fail closed。"
    result: passed
    reason:
      text: The unique-open-PR path reuses without editing only when title, body,
        base, head, SHA, and recovery identity remain exact.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: authoring artifact 缺失、过期、指纹不符、含占位符、无法唯一定位，或
